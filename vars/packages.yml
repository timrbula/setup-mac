---
# ==============================================================================
# Package and Application Definitions for macOS Setup
# ==============================================================================

# Homebrew repository taps (add third-party taps here if needed)
homebrew_taps: []

# CLI tools and utilities (installed via `brew install <package>`)
homebrew_packages:
  # Shell & Terminal enhancements
  - starship
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - zsh-autocomplete
  - fzf
  - tmux

  # Modern CLI utilities
  - bat
  - eza
  - ripgrep
  - fd
  - jq
  - yq
  - tree
  - htop
  - curl
  - wget

  # Git and VCS
  - git
  - gh

  # Editors & Viewers
  - neovim
  - bruno

  # Languages, Runtimes & Version Managers
  - rust
  - go
  - uv
  - vite-plus

  # Containers & Cloud Tools
  - awscli
  - hf

# GUI Applications (installed via `brew install --cask <app>`)
homebrew_cask_packages:
  # Browsers
  - google-chrome
  - firefox

  # Development & Terminals
  - ghostty
  - orbstack
  - visual-studio-code
  - visual-studio-code@insiders
  - lm-studio

  # Cloud CLIs & SDKs
  - ibm-cloud-cli
  - google-cloud-sdk

  # Utilities & Media
  - 1password
  - 1password-cli
  - cyberduck
  - obsidian
  - spotify

  # Fonts (IBM Plex Mono Nerd Font / BlexMono)
  - font-blex-mono-nerd-font

# Dotfiles configuration
dotfiles_repo: "https://github.com/timrbula/dotfiles.git"
dotfiles_dest: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
dotfiles_branch: "main"

# 1Password SSH Agent configuration
configure_1password_ssh: true

# Starship Prompt configuration
configure_starship: true
