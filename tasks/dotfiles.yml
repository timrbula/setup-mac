---
# ==============================================================================
# Dotfiles Setup & Synchronization
# ==============================================================================

- name: Ensure dotfiles repository is cloned and up to date
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: "{{ dotfiles_branch | default('main') }}"
    update: true
    accept_hostkey: true
  when: dotfiles_repo is defined and (dotfiles_repo | length > 0)
  tags:
    - dotfiles

- name: Check for setup or install script in dotfiles
  ansible.builtin.stat:
    path: "{{ dotfiles_dest }}/{{ item }}"
  loop:
    - "install.sh"
    - "setup.sh"
    - "bootstrap.sh"
  register: dotfiles_scripts
  when: dotfiles_repo is defined and (dotfiles_repo | length > 0)
  tags:
    - dotfiles

- name: Execute dotfiles install/setup script if present
  ansible.builtin.command:
    cmd: "./{{ item.item }}"
    chdir: "{{ dotfiles_dest }}"
  loop: "{{ dotfiles_scripts.results | default([]) }}"
  when:
    - item.stat is defined
    - item.stat.exists
  tags:
    - dotfiles
