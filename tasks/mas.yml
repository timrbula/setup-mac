---
- name: Check if mas CLI is installed
  ansible.builtin.command: which mas
  register: mas_check
  failed_when: false
  changed_when: false
  tags:
    - mas
    - apps

- name: Check if signed in to the Mac App Store
  ansible.builtin.command: mas account
  register: mas_account_check
  failed_when: false
  changed_when: false
  when: mas_check.rc == 0
  tags:
    - mas
    - apps

- name: Warn if not signed into Mac App Store
  ansible.builtin.debug:
    msg: "Warning: You are not signed into the Mac App Store. Open the App Store app and sign in to install MAS apps."
  when:
    - mas_check.rc == 0
    - mas_account_check.rc != 0
    - mas_packages is defined
    - (mas_packages | length > 0)
  tags:
    - mas
    - apps

- name: Install Mac App Store applications
  community.general.mas:
    id: "{{ item.id }}"
    state: present
  loop: "{{ mas_packages | default([]) }}"
  when:
    - mas_check.rc == 0
    - mas_account_check.rc == 0
    - mas_packages is defined
    - (mas_packages | length > 0)
  tags:
    - mas
    - apps
