---
- name: Check if VS Code CLI (code) is available
  ansible.builtin.command: which code
  register: vscode_cli_check
  failed_when: false
  changed_when: false
  tags:
    - vscode

- name: Get list of installed VS Code extensions
  ansible.builtin.command: code --list-extensions
  register: installed_vscode_extensions
  failed_when: false
  changed_when: false
  when: vscode_cli_check.rc == 0
  tags:
    - vscode

- name: Install VS Code extensions
  ansible.builtin.command: "code --install-extension {{ item }} --force"
  loop: "{{ vscode_extensions | default([]) }}"
  when:
    - vscode_cli_check.rc == 0
    - item | lower not in (installed_vscode_extensions.stdout_lines | default([]) | map('lower') | list)
  tags:
    - vscode
